name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-monitoring ./cmd/pocket-monitoring
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/pt DEMO_DATA=true AUTH_MODE=none ./pocket-monitoring &
          sleep 2
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/v1/servers | grep -q '"kind":"local"'
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/api/v1/servers/1/snapshot >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://localhost:8080/api/v1/servers/1/snapshot | grep -q '"cpu"'
          curl -fsS "http://localhost:8080/api/v1/servers/1/history?range=24h" | grep -q '"points"'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pocket-monitoring:pr
